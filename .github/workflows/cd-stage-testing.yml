# ==========================================================
# Continuous Deployment ‑ Staging Workflow (auto deploy on Main)
#
# MS Copilot Assisted
#
# Purpose: Deploy the Databricks Asset Bundle to Staging and execute the HRS ETL workflow.
#
# Execution Mode: Auto-triggerd when feature branch is merged into main branch(on: push)
#
# Source Data: RAND HRS dataset
#
# Target Schema: /staging_catalog/slv_cdm_hrs/
#  **For example:** if {bundle.target} = dev, then files are deployed to /staging_catalog.slv_cdm_hrs/
#   
#   Runs integration tests after PR merge. 
#
# ==========================================================

name: CD - Deployment to Staging Testing Only

on:
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          node-version: '24'

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy Bundle to Staging
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy --target staging

      - name: Run Staging Workflow
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: 
          databricks bundle run hrs_etl_job_testing --target staging
