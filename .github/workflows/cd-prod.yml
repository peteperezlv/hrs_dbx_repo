# ==========================================================
# Continuous Deployment ‑ Production Workflow (auto deploy on Main)
#
# MS Copilot Assisted
#
# Purpose: Deploy the Databricks Asset Bundle and execute the HRS ETL workflow.
#
# Execution Mode: Manually Triggerd (Workflow_dispatch)
#
# Source Data: RAND HRS dataset
#
# Target Schema: /prod_catalog/slv_cdm_hrs/
#  **For example:** if {bundle.target} = dev, then files are deployed to /prod_catalog.slv_cdm_hrs/
#
# Production deploy should always be manual.
#
# ==========================================================

name: CD - Deployment to Prod

on:
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment:
      name: prod

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          node-version: '24'

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy Bundle to Prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy --target prod

      - name: Run Production Workflow
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run:
          databricks bundle run hrs_etl_job --target prod

